version: '3.8'

services:
  mysql_reservas:
    image: mysql:latest
    container_name: mysql_reservas
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: ReservationDB
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
