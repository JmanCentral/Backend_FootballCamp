server:
  port: 8100

spring:
  application:
    name: msvc-field

  data:
    mongodb:
      uri: mongodb://root:mongopass@localhost:27017/mydb?authSource=admin

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: cancha-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    listener:
      missing-topics-fatal: false  # opcional: para evitar fallo si aún no existe el topic

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

